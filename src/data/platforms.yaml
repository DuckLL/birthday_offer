# 領取平台說明。key 要和 restaurants.yaml 的 platform 欄位一致

Ocard:
  intro: Ocard 會員集點平台。在店家 LINE 或 Ocard 頁面加入會員並填生日，生日月會自動發券到 Ocard 票夾。
  url: https://ocard.co

Line:
  intro: 加店家的 LINE 官方帳號並綁定會員資料，生日月在 LINE 內領券。

會員卡:
  intro: 店家實體或電子會員卡，需事先辦卡，部分店家規定不能生日當月才辦。

Web:
  intro: 在店家官網註冊會員並填生日。

31俱樂部:
  intro: 31 冰淇淋官方會員 APP「31俱樂部」（App Store / Google Play 搜尋同名），註冊會員並填生日，生日券在 APP 內。
  url: https://apps.apple.com/tw/app/id6755289789

樂多多:
  intro: 樂多多集團 APP（肉多多等品牌），當月壽星加入會員後在 APP 領生日禮。
  url: https://apps.apple.com/tw/app/id1563915787

錢都餐飲:
  intro: 錢都官方 APP「錢都餐飲」，壽星在 APP 內領肉品兌換券。
  url: https://apps.apple.com/tw/app/id1457310811

順億GO:
  intro: 順億鮪魚官方 APP「順億GO」，註冊會員並填生日，生日禮在 APP 內。
  url: https://apps.apple.com/tw/app/id1557394685

麥當勞APP:
  intro: 麥當勞官方 APP，註冊會員並填生日，生日優惠在 APP 內領取。
  url: https://apps.apple.com/tw/app/id1217507712

三商:
  intro: 三商 i 美食卡 APP，福勝亭、三商巧福、品川蘭、鮮五丼等品牌通用，生日券效期約兩個月。

豆腐:
  intro: 豆府餐飲集團「豆府鐵粉卡」APP / LINE，涓豆腐、北村豆腐家等品牌適用。

美食通:
  intro: 六角國際「六角美食通」APP，杏子豬排、京都勝牛等品牌適用。生日註冊後不能自行修改。

wa10:
  intro: 瓦城泰統集團會員（瓦城、非常泰、大心等），生日券在集團 APP。
  url: https://www.thaitown.com.tw

莫凡彼:
  intro: 莫凡彼集團卡 APP，莫凡彼、尖牙、海壽司等品牌適用。

王品:
  intro: 王品集團「王品瘋」APP，旗下各品牌生日禮在 APP 領取。
  url: https://www.wowprime.com

iEAT:
  intro: 饗賓集團「iEAT 饗愛吃」APP，前一個月 20 日發送當月壽星券。
  url: https://www.eatogether.com.tw

爭鮮:
  intro: 爭鮮集團會員 APP，爭鮮、定食8、爭鮮gogo 等品牌適用。
  url: https://www.sushiexpress.com.tw

PK:
  intro: PK 雙饗卡 APP，必勝客與肯德基共用，生日券效期約兩個月。
  url: https://www.pkcard.com.tw

MOS:
  intro: 摩斯漢堡 MOS Card / 摩斯 APP。
  url: https://www.mos.com.tw

金色三麥:
  intro: 金色三麥官網會員。
  url: https://www.lebledor.com

Cosmos club:
  intro: 天成飯店集團 Cosmos CLUB APP。
